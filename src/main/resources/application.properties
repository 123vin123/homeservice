spring.application.name=homeservice

# Server port (Render sets PORT env variable dynamically)
server.port=${PORT:8080}

# Datasource configuration with environment variable fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homeservice}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Flyway and use native SQL init
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

